services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: carpoolingdb
      MYSQL_USER: carpool
      MYSQL_PASSWORD: carpoolpass
      MYSQL_ROOT_PASSWORD: rootpass
    ports:
      - "3306:3306"
    volumes:
      - carpooling-db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/carpoolingdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      DB_USER: carpool
      DB_PASS: carpoolpass
    ports:
      - "8090:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  carpooling-db:
